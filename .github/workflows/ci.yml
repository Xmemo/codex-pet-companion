name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install Python test dependency
        run: python -m pip install pytest==8.4.2

      - name: Run Node tests
        env:
          # GitHub hosted macOS runners do not provide a stable WindowServer.
          # Only the display-dependent anchor test is skipped; local macOS
          # acceptance remains a required release gate.
          CODEX_SKIP_DISPLAY_TESTS: "1"
        run: CODEX_TIMER_OVERLAY_HOME="$(mktemp -d)" node --test tests/*.test.js

      - name: Run Python tests
        run: PYTHONPATH=. python -m pytest -q

      - name: Typecheck Swift code
        run: xcrun swiftc -typecheck src/companion_renderer.swift src/timer_panel.swift

      - name: Lint shell scripts
        run: zsh -n scripts/install.sh scripts/uninstall.sh scripts/bootstrap.sh scripts/package-release.sh

      - name: Lint LaunchAgent plists
        run: plutil -lint packaging/io.github.codex-ultradian-rhythm.plist packaging/io.github.codex-pet-companion.plist

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD || git diff --check
